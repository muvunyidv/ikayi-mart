name: Deploy IKAYI MART to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (for Flutter)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Require Google Client ID
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "Missing GitHub secret GOOGLE_CLIENT_ID."
            echo "Add it at: Settings → Secrets and variables → Actions → New repository secret"
            echo "Name must be exactly GOOGLE_CLIENT_ID"
            exit 1
          fi

      - name: Build Web App
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: flutter build web --release --base-href / --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build/web
          publish_branch: gh-pages
          force_orphan: true
          cname: mart.ikayi.app
          enable_jekyll: false
